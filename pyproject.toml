[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "acronym-finder"
version = "0.1.0"
description = "Generate pronounceable acronyms from a sequence of words."
requires-python = ">=3.12"
dependencies = ["dataclasses-json"]

[project.scripts]
acronyms = "acronym_finder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
